[project]
name = "customs-ml"
version = "0.1.0"
description = "Dataset pipeline, training, and evaluation for the Customs package malware classifier"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "numpy>=2",
  "pandas>=2.2",
  "pyarrow>=16",
  "scikit-learn>=1.5",
  "lightgbm>=4.3",
  "matplotlib>=3.8",
  "requests>=2.32",
  "rapidfuzz>=3.9",
  "scipy>=1.13",
  "packaging>=23",
]

[project.optional-dependencies]
nn = ["torch>=2.4"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
customs-ml = "customs_ml.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["customs_ml*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
