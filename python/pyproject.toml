[project]
name = "customs-ml"
version = "0.9.0"
description = "Dataset pipeline, training, and evaluation for the Customs package malware classifier"
requires-python = ">=3.14"
license = { text = "MIT" }
dependencies = [
  "numpy>=2",
  "pandas>=2.2",
  "pyarrow>=16",
  "scikit-learn>=1.5",
  "lightgbm>=4.3",
  "matplotlib>=3.8",
  "requests>=2.32",
  "rapidfuzz>=3.9",
  "scipy>=1.13",
  "packaging>=23",
]

[project.optional-dependencies]
nn = ["torch>=2.4"]
# The tests exercise the CNN, so dev includes torch.
dev = ["pytest>=8", "ruff>=0.6", "torch>=2.4"]

[project.scripts]
customs-ml = "customs_ml.cli:main"

# On Linux, torch comes from the CPU-only index: the PyPI wheel pulls several GB of CUDA
# libraries. The macOS wheel on PyPI is already CPU-only.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["customs_ml*"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
# PLW1514 (unspecified-encoding) is a preview rule; explicit-preview-rules keeps every other
# preview rule off, so text I/O must name its encoding without changing anything else.
preview = true
explicit-preview-rules = true
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PLW1514", "T20"]

[tool.ruff.lint.per-file-ignores]
# Library code logs through pipeline.log; only command-line entry points print.
"customs_ml/{cli,history_eval,misses,pipeline,popular_check,report,variance}.py" = ["T201"]
"scripts/*.py" = ["T201"]
"tests/*.py" = ["T201"]

[tool.pytest.ini_options]
testpaths = ["tests"]
