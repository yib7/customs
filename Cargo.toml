[workspace]
resolver = "2"
members = ["crates/customs-scan", "crates/customs-model", "crates/customs", "crates/customs-py"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/yib7/new_proj"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tar = "0.4"
flate2 = "1"
bzip2 = "0.6"
zip = { version = "8", default-features = false, features = ["deflate-flate2", "bzip2", "lzma"] }
sha2 = "0.11"
regex = "1"
toml = "1"
rayon = "1"
pyo3 = { version = "0.29", features = ["abi3-py39"] }
base64 = "0.23"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"
axum = { version = "0.8", features = ["macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["cors", "fs"] }
hyper = "1"
http = "1"
bytes = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "gzip", "json", "query", "http2", "charset"] }
rusqlite = { version = "0.40", features = ["bundled"] }
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
hex = "0.4"
url = "2"
percent-encoding = "2"
semver = "1"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
