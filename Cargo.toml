[workspace]
resolver = "2"
members = ["crates/customs-scan", "crates/customs-model", "crates/customs", "crates/customs-py"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/yib7/new_proj"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
tar = "0.4"
flate2 = "1"
bzip2 = "0.6"
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }
sha2 = "0.11"
regex = "1"
toml = "1"
clap = { version = "4", features = ["derive"] }
rayon = "1"
pyo3 = { version = "0.29", features = ["abi3-py39"] }

[profile.release]
lto = "thin"
codegen-units = 1
