[workspace]
resolver = "2"
members = ["crates/customs-scan", "crates/customs-model", "crates/customs", "crates/customs-py"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/yib7/new_proj"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"

[profile.release]
lto = "thin"
codegen-units = 1
