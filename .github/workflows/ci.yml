name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # Same version as rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # Rust inference must reproduce the Python reference on the shipped models.
      - run: cargo test -p customs-model --test parity
      # Real pip, uv and npm through `customs serve`, against a local fake registry.
      - if: runner.os == 'Linux'
        run: cargo build -p customs
      - if: runner.os == 'Linux'
        uses: actions/setup-python@v7
        with:
          python-version-file: python/.python-version
      - if: runner.os == 'Linux'
        uses: astral-sh/setup-uv@v10.2.0
      - if: runner.os == 'Linux'
        uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
      - if: runner.os == 'Linux'
        uses: oven-sh/setup-bun@v2
      - if: runner.os == 'Linux'
        run: npm install --global pnpm@12.10.1 yarn@1.22.22
      - if: runner.os == 'Linux'
        run: python3 python/scripts/installer_e2e.py --bin target/debug/customs --require pip,uv,npm,pnpm,yarn,bun

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      # Fails when uv.lock is out of date with pyproject.toml.
      - run: uv sync --locked --extra dev
      # The CPU build of torch; the locked default pulls several GB of CUDA libraries.
      - run: uv pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: uv run --no-sync ruff check customs_ml tests scripts
      - run: uv run --no-sync ruff format --check customs_ml tests scripts
      - run: uv run --no-sync pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

  docker:
    runs-on: ubuntu-latest
    needs: [rust, web]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          tags: customs:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
      - run: npm audit --audit-level=high
        working-directory: web

  # Runs the README's Setup steps, as written, on a fresh runner with nothing cached.
  readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
      - name: Follow the Setup section of README.md
        run: |
          python3 - <<'EOF'
          import re, subprocess, sys, time, urllib.request

          readme = open("README.md", encoding="utf-8").read()
          setup = readme.split("\n## Setup\n", 1)[1].split("\n## ", 1)[0]
          commands = [
              line.strip()
              for block in re.findall(r"```sh\n(.*?)```", setup, re.S)
              for line in block.splitlines()
              if line.strip() and not line.strip().startswith("#")
          ]
          if not commands:
              sys.exit("no commands found in the Setup section")
          for cmd in commands:
              if cmd.startswith(("git clone", "cd ")):
                  print(f"skip (the checkout is the clone): {cmd}", flush=True)
                  continue
              print(f"$ {cmd}", flush=True)
              if cmd.endswith("customs serve"):
                  # Its output goes to a file so it does not hold this step's pipe open.
                  server = subprocess.Popen(
                      cmd, shell=True, stdout=open("serve.log", "w"), stderr=subprocess.STDOUT
                  )
                  for _ in range(100):
                      try:
                          urllib.request.urlopen("http://127.0.0.1:7878/healthz", timeout=1)
                          break
                      except OSError:
                          time.sleep(0.2)
                  else:
                      sys.exit("the server did not come up")
                  continue
              r = subprocess.run(cmd, shell=True, capture_output=True, text=True)
              print(r.stdout + r.stderr, flush=True)
              if " check " in cmd:
                  # A block exits 3; the README says the output shows BLOCK.
                  if "BLOCK" not in r.stdout:
                      sys.exit(f"expected BLOCK from: {cmd}")
              elif r.returncode != 0:
                  sys.exit(f"exit {r.returncode}: {cmd}")
          html = urllib.request.urlopen("http://127.0.0.1:7878/", timeout=5).read().decode()
          if '<div id="root">' not in html:
              sys.exit("the dashboard is not being served")
          subprocess.run(["pkill", "-x", "customs"])
          print("README setup steps passed")
          EOF
