name: Release

# Publishing a GitHub Release attaches prebuilt binaries to it and pushes the container
# image to GitHub Container Registry.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  binaries:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - run: cargo build --release --locked -p customs -p customs-scan
      # License notices of the crates compiled into the binaries.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2
      - run: cargo about generate --locked -c deploy/about.toml -m crates/customs/Cargo.toml deploy/about.hbs -o THIRD_PARTY_LICENSES.md
      # bin/customs finds ../share/customs/models and ../share/customs/ui on its own.
      - name: Package
        env:
          NAME: customs-${{ github.event.release.tag_name }}-${{ matrix.target }}
        run: |
          mkdir -p "$NAME/bin" "$NAME/share/customs/models"
          cp target/release/customs target/release/customs-scan "$NAME/bin/"
          cp models/*.json models/*.txt "$NAME/share/customs/models/"
          cp -R web/dist "$NAME/share/customs/ui"
          cp LICENSE README.md THIRD_PARTY_LICENSES.md "$NAME/"
          tar czf "$NAME.tar.gz" "$NAME"
          shasum -a 256 "$NAME.tar.gz" > "$NAME.tar.gz.sha256"
          "$NAME/bin/customs" --version
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: customs-*.tar.gz*

  upload:
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" customs-*.tar.gz* --repo "$GITHUB_REPOSITORY" --clobber

  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: tags
        env:
          TAG: ${{ github.event.release.tag_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          image="ghcr.io/${OWNER,,}/customs"
          echo "list=$image:${TAG#v},$image:latest" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.list }}
