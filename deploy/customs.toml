# Example policy. See docs/DESIGN.md section 8.
mode = "enforce"
warn_threshold = "model"
block_threshold = "model"
min_age_days = 3
min_age_severity = "block"
block_nonexistent = true
block_install_scripts_from_new = true
# Release history rules ("off", "warn" or "block"): heuristics that compare a version with
# the releases before it to flag possible account takeovers. See docs/DESIGN.md section 8.
provenance_dropped = "warn"
install_script_added = "block"
publisher_changed = "warn"
dormant_revival = "warn"
dormant_days = 365
version_anomaly = "off"
# provenance_dropped, publisher_changed, dormant_revival, version_anomaly and
# young_dependency_added apply to releases published within this many days (0: any age).
history_window_days = 90
nonregistry_dependency_added = "block"
young_dependency_added = "block"
young_dependency_days = 7
unread_code = "block"
scan_error = "block"
startup_hook = "block"
agent_bypass = "block"
allow = []
deny = []
