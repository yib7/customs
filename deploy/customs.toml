# Example policy. See docs/DESIGN.md section 8.
mode = "enforce"
warn_threshold = "model"
block_threshold = "model"
min_age_days = 3
min_age_severity = "block"
block_nonexistent = true
block_install_scripts_from_new = true
# Release history rules ("off", "warn" or "block"): heuristics that compare a version with
# the releases before it to flag possible account takeovers. See docs/DESIGN.md section 8.
provenance_dropped = "warn"
install_script_added = "warn"
publisher_changed = "warn"
dormant_revival = "warn"
dormant_days = 365
version_anomaly = "off"
allow = []
deny = []
