# Customs plus Prometheus scraping its /metrics endpoint.
#   docker compose -f deploy/docker-compose.yml up --build
# Then point package managers at it:
#   eval "$(customs env --server http://localhost:7878)"
# or, without the binary:
#   export PIP_INDEX_URL=http://localhost:7878/pypi/simple
#   export npm_config_registry=http://localhost:7878/npm/
services:
  customs:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: customs:local
    ports:
      - "127.0.0.1:7878:7878"
    volumes:
      - customs-data:/var/lib/customs
    environment:
      CUSTOMS_LOG_JSON: "1"
      # The container listens on 0.0.0.0, which would turn off anonymous policy changes;
      # the port above is published on 127.0.0.1 only. Set CUSTOMS_ADMIN_TOKEN instead
      # when publishing it more widely.
      CUSTOMS_ALLOW_ANONYMOUS_POLICY_CHANGES: "true"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - customs

volumes:
  customs-data:
