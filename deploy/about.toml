# cargo-about configuration: the license notices of the crates compiled into the release
# binaries (see .github/workflows/release.yml and deploy/Dockerfile).
accepted = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "Unlicense",
  "BSL-1.0",
  "Unicode-3.0",
  "CC0-1.0",
  "bzip2-1.0.6",
]
targets = ["x86_64-unknown-linux-gnu", "aarch64-apple-darwin"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
# The workspace crates themselves (publish = false) are this project, under its own LICENSE.
private = { ignore = true }
