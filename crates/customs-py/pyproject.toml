[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "customs-scan"
description = "Python bindings for the Customs package archive scanner"
requires-python = ">=3.9"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]
dynamic = ["version"]

[tool.maturin]
module-name = "customs_scan"
features = ["extension-module"]
