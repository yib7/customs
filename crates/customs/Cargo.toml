[package]
name = "customs"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Package firewall for AI coding agents"

[lib]
name = "customs"
path = "src/lib.rs"

[[bin]]
name = "customs"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tokio-util.workspace = true
futures.workspace = true
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
hyper.workspace = true
http.workspace = true
bytes.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
toml.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
sha2.workspace = true
hex.workspace = true
base64.workspace = true
regex.workspace = true
url.workspace = true
percent-encoding.workspace = true
semver.workspace = true
customs-scan = { path = "../customs-scan" }
customs-model = { path = "../customs-model" }

# malloc_trim: hands memory freed after a burst of scans back to the OS (util::release_free_memory).
[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
tar.workspace = true
flate2.workspace = true
